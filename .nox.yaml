scan:
  exclude:
    - "vendor/"
    # CI workflows: pinned commit SHAs + GITHUB_TOKEN refs look like secrets
    # to entropy rules (workflow security is a separate tool's concern).
    - ".github/workflows/*.yml"
    # Docs: example snippets / placeholder tokens.
    - "README.md"
    - "CHANGELOG.md"
    - "docs/*.md"
    - "**/README.md"
    # Test files: OTel trace/span IDs are 16/32-char hex strings (W3C trace
    # context), structurally indistinguishable from secrets/split-API-keys to
    # the entropy + SEC-659 rules. bolt is an OTel-correlating logger, so its
    # tests are full of trace-ID fixtures (e.g. "0102...0f10"). Same rationale
    # as the workflow-SHA exclusion above; production code stays fully scanned.
    # Both globs needed: "**/" does not match repo-root files (see README pair).
    - "*_test.go"
    - "**/*_test.go"
    # Baseline file is itself a list of finding fingerprints (hashes).
    - ".nox/baseline.json"
    - "benchmarks/"
    - "examples/"
    - ".relicta/"
    - ".cover/"
    - ".nox/"
    - ".roady/"
    - ".git/"
    - "findings.json"
    - "go.sum"
    - "**/go.sum"

  rules:
    disable: []

    severity_override: {}

output:
  format: json
  directory: .

policy:
  fail_on: high
  warn_on: medium

# Activate nox code-level taint SAST (source-to-sink: SSRF, injection,
# path traversal). nox scan auto-installs (cosign-verified) + runs it.
plugins:
  required:
    - nox/taint-analysis
